<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — PowerLLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #150B1E;
    --plum: #241033;
    --plum-soft: #33184A;
    --filament: #FFB627;
    --filament-hot: #FFD470;
    --arc: #FF5E5B;
    --wire: #7B5EA7;
    --glow: #F5EDFF;
    --dim: #A08CB8;

    --display: 'Bricolage Grotesque', sans-serif;
    --body: 'Instrument Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  html, body{ height: 100%; }
  body{
    font-family: var(--body);
    background: var(--void);
    color: var(--glow);
    line-height: 1.6;
    display: flex; flex-direction: column;
  }

  a{ color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--filament); outline-offset: 3px; border-radius: 3px;
  }

  /* ---------- Nav ---------- */
  nav{
    border-bottom: 1px solid rgba(123,94,167,0.18);
    background: rgba(21,11,30,0.9);
    flex-shrink: 0;
  }
  .nav-in{
    max-width: 900px; margin: 0 auto; padding: 15px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand{
    font-family: var(--display); font-weight: 800; font-size: 1.12rem;
    letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px;
  }
  .brand .bulb{
    width: 9px; height: 9px; border-radius: 50%; background: var(--filament);
    box-shadow: 0 0 10px var(--filament);
  }
  .back{
    font-family: var(--mono); font-size: 0.78rem; color: var(--dim);
  }
  .back:hover{ color: var(--filament); }

  /* ---------- Chat shell ---------- */
  .chat-shell{
    flex: 1; display: flex; flex-direction: column;
    max-width: 900px; width: 100%; margin: 0 auto; padding: 0 24px;
    min-height: 0;
  }

  .chat-scroll{
    flex: 1; overflow-y: auto; padding: 30px 0 20px;
    display: flex; flex-direction: column; gap: 18px;
  }

  /* Empty state — the page's opening moment */
  .opener{ margin: auto 0; padding: 20px 0 34px; }
  .opener h1{
    font-family: var(--display); font-weight: 800;
    font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.05;
    letter-spacing: -0.035em; margin-bottom: 12px;
  }
  .opener h1 em{ font-style: normal; color: var(--filament); }
  .opener p{ color: var(--dim); max-width: 46ch; margin-bottom: 26px; }

  .starters{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 620px; }
  @media (max-width: 620px){ .starters{ grid-template-columns: 1fr; } }
  .starter{
    text-align: left; cursor: pointer;
    background: rgba(51,24,74,0.4); border: 1px solid rgba(123,94,167,0.28);
    border-radius: 10px; padding: 14px 16px;
    color: var(--glow); font-family: var(--body); font-size: 0.92rem;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .starter:hover{
    border-color: rgba(255,182,39,0.5); background: rgba(51,24,74,0.65);
    transform: translateY(-2px);
  }
  .starter span{
    display: block; font-family: var(--mono); font-size: 0.68rem;
    letter-spacing: 0.12em; color: var(--filament); margin-bottom: 6px;
  }

  /* ---------- Messages ---------- */
  .msg{ max-width: 78%; font-size: 1rem; line-height: 1.65; }
  .msg.you{
    align-self: flex-end;
    background: var(--filament); color: var(--void);
    padding: 12px 17px; border-radius: 14px 14px 4px 14px;
    font-weight: 500;
  }
  .msg.bot{
    align-self: flex-start;
    background: rgba(51,24,74,0.55); border: 1px solid rgba(123,94,167,0.26);
    padding: 13px 18px; border-radius: 14px 14px 14px 4px;
    white-space: pre-wrap;
  }
  .msg.err{ border-color: rgba(255,94,91,0.5); color: #FFC9C8; }

  .thinking{ display: inline-flex; gap: 5px; align-items: center; padding: 3px 0; }
  .thinking i{
    width: 6px; height: 6px; border-radius: 50%; background: var(--filament);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking i:nth-child(2){ animation-delay: 0.16s; }
  .thinking i:nth-child(3){ animation-delay: 0.32s; }
  @keyframes pulse{
    0%,60%,100%{ transform: translateY(0); opacity: 0.45; }
    30%{ transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- Composer ---------- */
  .composer{
    flex-shrink: 0; padding: 14px 0 26px;
    background: linear-gradient(180deg, transparent, var(--void) 26%);
  }
  .composer-in{
    display: flex; gap: 10px; align-items: flex-end;
    background: rgba(51,24,74,0.5); border: 1.5px solid rgba(123,94,167,0.35);
    border-radius: 14px; padding: 8px 8px 8px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .composer-in:focus-within{
    border-color: var(--filament);
    box-shadow: 0 0 0 3px rgba(255,182,39,0.14);
  }
  #ask{
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--glow); font-family: var(--body); font-size: 1rem;
    line-height: 1.55; padding: 9px 0; max-height: 160px; min-height: 24px;
  }
  #ask::placeholder{ color: var(--dim); }
  #send{
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; border: none;
    background: var(--filament); color: var(--void); cursor: pointer;
    font-size: 1.15rem; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, opacity 0.2s;
  }
  #send:hover:not(:disabled){ transform: translateY(-2px); }
  #send:disabled{ opacity: 0.4; cursor: default; }

  .composer-note{
    font-family: var(--mono); font-size: 0.7rem; color: var(--dim);
    text-align: center; margin-top: 11px; letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a href="powerllm.html" class="brand"><span class="bulb"></span>PowerLLM</a>
    <a href="powerllm.html" class="back">← Back to site</a>
  </div>
</nav>

<div class="chat-shell">
  <div class="chat-scroll" id="scroll">
    <div class="opener" id="opener">
      <h1>What are you <em>stuck on?</em></h1>
      <p>Ask anything — a bug you can't place, an idea you can't word, a concept that hasn't clicked yet.</p>
      <div class="starters">
        <button class="starter" data-q="Explain closures in JavaScript with a simple example.">
          <span>EXPLAIN</span>How do closures work?
        </button>
        <button class="starter" data-q="My CSS rule isn't applying to the element. What are the usual causes?">
          <span>DEBUG</span>Why won't my CSS apply?
        </button>
        <button class="starter" data-q="Write a simple HTML contact form with name, email and message fields, styled with CSS.">
          <span>BUILD</span>Write me a contact form
        </button>
        <button class="starter" data-q="Help me write a short, polite follow-up email to someone who hasn't replied in a week.">
          <span>DRAFT</span>Draft a follow-up email
        </button>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-in">
      <textarea id="ask" rows="1" placeholder="Ask PowerLLM anything…" autocomplete="off"></textarea>
      <button id="send" aria-label="Send message">↑</button>
    </div>
    <div class="composer-note">Enter to send · Shift + Enter for a new line</div>
  </div>
</div>

<!-- Chatbot lives inline on this page, not as a corner bubble -->
<zapier-interfaces-chatbot-embed
  is-popup="false"
  chatbot-id="cmtec4lg3003wz54o00yxa4v7"
  style="display:none"></zapier-interfaces-chatbot-embed>
<script async type="module" src="https://interfaces.zapier.com/assets/web-components/zapier-interfaces/zapier-interfaces.esm.js"></script>

<script>
  (function(){
    var scroll  = document.getElementById('scroll');
    var opener  = document.getElementById('opener');
    var input   = document.getElementById('ask');
    var sendBtn = document.getElementById('send');

    // Textarea grows with the message instead of scrolling in a one-line box
    function autoGrow(){
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    }
    input.addEventListener('input', autoGrow);

    function addMsg(text, kind){
      var d = document.createElement('div');
      d.className = 'msg ' + kind;
      d.textContent = text;
      scroll.appendChild(d);
      scroll.scrollTop = scroll.scrollHeight;
      return d;
    }

    function thinking(){
      var d = document.createElement('div');
      d.className = 'msg bot';
      d.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
      scroll.appendChild(d);
      scroll.scrollTop = scroll.scrollHeight;
      return d;
    }

    var busy = false;

    function ask(text){
      text = (text || '').trim();
      if (!text || busy) return;

      if (opener && opener.parentNode){ opener.remove(); }

      busy = true;
      addMsg(text, 'you');
      input.value = '';
      autoGrow();
      sendBtn.disabled = true;

      var pending = thinking();

      // Zapier's embed doesn't expose a direct send API, so the chat panel
      // opens with the question ready to go.
      setTimeout(function(){
        pending.remove();
        var note = addMsg(
          'Opening the PowerLLM chat now — your question is copied, so paste it in and hit send.',
          'bot'
        );

        // Put the question on the clipboard so it's one paste away
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).catch(function(){});
        }

        var embed = document.querySelector('zapier-interfaces-chatbot-embed');
        if (embed){
          embed.style.display = '';
          embed.setAttribute('is-popup', 'true');
          setTimeout(function(){
            var launcher = embed.shadowRoot && embed.shadowRoot.querySelector('button');
            if (launcher) launcher.click();
          }, 400);
        } else {
          note.className = 'msg bot err';
          note.textContent = 'The chat could not load. Check your connection and refresh the page.';
        }

        busy = false;
        sendBtn.disabled = false;
      }, 600);
    }

    sendBtn.addEventListener('click', function(){ ask(input.value); });

    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        ask(input.value);
      }
    });

    var starters = document.querySelectorAll('.starter');
    for (var i = 0; i < starters.length; i++){
      starters[i].addEventListener('click', function(){
        ask(this.getAttribute('data-q'));
      });
    }

    input.focus();
  })();
</script>

</body>
</html>
